[project]
name = "hotstring"
version = "0.1.0"
description = "Windows text expansion and command launcher"
readme = "README.md"
authors = [
    { name = "jeeradate", email = "jeeradate@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["windows", "text-expander", "hotstring", "keyboard", "automation", "nicegui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "nicegui>=4.0.0",
    "pillow>=13.0.0",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
    "sqlmodel>=0.0.50",
]

[project.scripts]
hotstring = "hotstring.__main__:main"

[project.urls]
Homepage = "https://github.com/jeeradate/hotstring"
Repository = "https://github.com/jeeradate/hotstring"
Issues = "https://github.com/jeeradate/hotstring/issues"
Changelog = "https://github.com/jeeradate/hotstring/releases"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
